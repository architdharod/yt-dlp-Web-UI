name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly rebuild so `latest` always ships a recent yt-dlp.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt plus pytest,
      # pytest-asyncio (pyproject sets asyncio_mode = auto) and httpx
      # (needed by fastapi's TestClient).
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  # The image installs deno itself, at a version the Dockerfile pins.  It has
  # to be the version yt-dlp pins in its `pin-deno` extra, or the runtime
  # yt-dlp's YouTube extractor gets is not the one it was tested against.  The
  # extra is declaration-only (nothing installs it), so the pin is read out of
  # the installed yt-dlp's metadata and compared.
  #
  # Its own job, deliberately outside `publish.needs`: yt-dlp bumping the pin
  # is a housekeeping task, and it should show up as a red check rather than
  # block the weekly rebuild that keeps `latest` shipping a recent yt-dlp.
  deno-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check DENO_VERSION matches yt-dlp's pin-deno extra
        working-directory: backend
        run: |
          pin=$(python scripts/deno_pin.py)
          echo "yt-dlp pins deno $pin"
          if ! grep -q "ARG DENO_VERSION=$pin" Dockerfile; then
            echo "::error file=backend/Dockerfile::ARG DENO_VERSION does not match yt-dlp's pin-deno extra ($pin). Bump it and the DENO_SHA256_* checksums."
            grep -n 'ARG DENO_VERSION=' Dockerfile
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      # `npm test` is vitest in watch mode; --run is the single-pass form CI needs.
      - name: Test
        working-directory: frontend
        run: npm test -- --run

  # The backend image is only built-and-pushed on main, so a PR that breaks the
  # Dockerfile would otherwise not find out until merge.  Build both platforms
  # without pushing: the deno install is arch-specific, so amd64 alone would
  # miss half of it.
  backend-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed to build the arm64 image on an amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: false
          # backend-pr first: this job writes that scope, so a repeat push to
          # the same PR reads its own layers back instead of only main's.
          cache-from: |
            type=gha,scope=backend-pr
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-pr

  publish:
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't cancel the other image if one fails; both are independent.
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/architdharod/music-for-arr-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/architdharod/music-for-arr-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme:
      #   latest              - always, this is what the homelab pulls
      #   sha-<7 char sha>    - push to main only, for pinning/rollback to a commit
      #   weekly-<YYYYMMDD>   - scheduled (and manual) rebuilds, for rollback to a
      #                         known-good weekly yt-dlp refresh
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ matrix.image }}
          # Add `latest` ourselves rather than letting the flavor guess.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            type=schedule,pattern={{date 'YYYYMMDD'}},prefix=weekly-
            type=raw,value=weekly-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service == 'frontend' && 'VITE_API_BASE_URL=/api' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Record which yt-dlp the shipped backend actually contains; yt-dlp is
      # pinned as a floor (>=), so the resolved version moves with each rebuild.
      - name: Log shipped yt-dlp version
        if: matrix.service == 'backend'
        run: |
          docker pull ${{ matrix.image }}:latest
          echo "yt-dlp version in ${{ matrix.image }}:latest:"
          docker run --rm --entrypoint yt-dlp ${{ matrix.image }}:latest --version
