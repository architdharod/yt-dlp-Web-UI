name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly rebuild so `latest` always ships a recent yt-dlp.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt plus pytest,
      # pytest-asyncio (pyproject sets asyncio_mode = auto) and httpx
      # (needed by fastapi's TestClient).
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  publish:
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Don't cancel the other image if one fails; both are independent.
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/architdharod/music-for-arr-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/architdharod/music-for-arr-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme:
      #   latest              - always, this is what the homelab pulls
      #   sha-<7 char sha>    - push to main only, for pinning/rollback to a commit
      #   weekly-<YYYYMMDD>   - scheduled (and manual) rebuilds, for rollback to a
      #                         known-good weekly yt-dlp refresh
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ matrix.image }}
          # Add `latest` ourselves rather than letting the flavor guess.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}
            type=schedule,pattern={{date 'YYYYMMDD'}},prefix=weekly-
            type=raw,value=weekly-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service == 'frontend' && 'VITE_API_BASE_URL=/api' || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Record which yt-dlp the shipped backend actually contains; yt-dlp is
      # pinned as a floor (>=), so the resolved version moves with each rebuild.
      - name: Log shipped yt-dlp version
        if: matrix.service == 'backend'
        run: |
          docker pull ${{ matrix.image }}:latest
          echo "yt-dlp version in ${{ matrix.image }}:latest:"
          docker run --rm --entrypoint yt-dlp ${{ matrix.image }}:latest --version
