# Homelab stack. This file pulls prebuilt images from GHCR and does not build
# anything locally. For development, `docker-compose.override.yml` sits next to
# this file and adds the `build:` blocks back, so `docker compose up --build`
# builds from source. Do not copy the override file to the homelab.
services:
  frontend:
    image: ghcr.io/architdharod/music-for-arr-frontend:latest
    container_name: yt-dlp-web-ui-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3033}:80"
    labels:
      - homepage.group=muusic.dharod.de
      - homepage.name=music-for-arr
      - homepage.icon=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/youtube-dl.svg
      - homepage.href=https://get-youtube.int.dharod.de
      - homepage.description=download music from YouTube/SoundCloud as FLAC
      - homepage.siteMonitor=https://get-youtube.int.dharod.de
      - homepage.weight=20

  backend:
    image: ghcr.io/architdharod/music-for-arr-backend:latest
    container_name: yt-dlp-web-ui-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      - DOWNLOAD_PATH=${DOWNLOAD_PATH:-/data/music/downloads}
      - DOWNLOAD_TIMEOUT_SECONDS=${DOWNLOAD_TIMEOUT_SECONDS:-900}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - DATA_PATH=/config
      - HOME=/tmp
      # Rescan targets. Each service is skipped when its variables are empty,
      # so an unset one simply turns that half of the hook off.
      - NAVIDROME_URL=${NAVIDROME_URL:-}
      - NAVIDROME_USER=${NAVIDROME_USER:-}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-}
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - LIDARR_ROOT_FOLDER=${LIDARR_ROOT_FOLDER:-}
      # The automatic MusicBrainz tag fix after every download.
      - TAG_FIX_ENABLED=${TAG_FIX_ENABLED:-true}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      - TAG_FIX_TIMEOUT_SECONDS=${TAG_FIX_TIMEOUT_SECONDS:-60}
      # How long one collection probe may take, end to end.
      - PROBE_TIMEOUT_SECONDS=${PROBE_TIMEOUT_SECONDS:-120}
      # Cookies for YouTube's "Sign in to confirm you're not a bot" check.
      # Unset by default; see the README. Set it to the *container* path below,
      # /cookies/youtube.txt, and point YTDLP_COOKIES_HOST_PATH at the file on
      # the host. The backend only ever reads the file -- it loads it into an
      # in-memory cookie jar at startup and never writes one back -- so the
      # mount below is read-only.
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
    volumes:
      - ${DOWNLOAD_PATH:-/data/music/downloads}:${DOWNLOAD_PATH:-/data/music/downloads}
      - music-for-arr-data:/config
      # compose has no conditional mounts, so the default source is /dev/null:
      # the stack still starts when no cookies file is configured, and nothing
      # reads /cookies/youtube.txt unless YTDLP_COOKIES_FILE names it.
      - ${YTDLP_COOKIES_HOST_PATH:-/dev/null}:/cookies/youtube.txt:ro

volumes:
  music-for-arr-data: {}
