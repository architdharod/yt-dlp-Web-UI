# Homelab stack. This file pulls prebuilt images from GHCR and does not build
# anything locally. For development, `docker-compose.override.yml` sits next to
# this file and adds the `build:` blocks back, so `docker compose up --build`
# builds from source. Do not copy the override file to the homelab.
services:
  frontend:
    image: ghcr.io/architdharod/music-for-arr-frontend:latest
    container_name: yt-dlp-web-ui-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3033}:80"
    labels:
      - homepage.group=muusic.dharod.de
      - homepage.name=music-for-arr
      - homepage.icon=https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/youtube-dl.svg
      - homepage.href=https://get-youtube.int.dharod.de
      - homepage.description=download music from YouTube/SoundCloud as FLAC
      - homepage.siteMonitor=https://get-youtube.int.dharod.de
      - homepage.weight=20

  backend:
    image: ghcr.io/architdharod/music-for-arr-backend:latest
    container_name: yt-dlp-web-ui-backend
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    environment:
      - DOWNLOAD_PATH=${DOWNLOAD_PATH:-/data/music/downloads}
      - DOWNLOAD_TIMEOUT_SECONDS=${DOWNLOAD_TIMEOUT_SECONDS:-900}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-2}
      - DATA_PATH=/config
      - HOME=/tmp
      # Rescan targets. Each service is skipped when its variables are empty,
      # so an unset one simply turns that half of the hook off.
      - NAVIDROME_URL=${NAVIDROME_URL:-}
      - NAVIDROME_USER=${NAVIDROME_USER:-}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-}
      - LIDARR_URL=${LIDARR_URL:-}
      - LIDARR_API_KEY=${LIDARR_API_KEY:-}
      - LIDARR_ROOT_FOLDER=${LIDARR_ROOT_FOLDER:-}
      # The automatic MusicBrainz tag fix after every download.
      - TAG_FIX_ENABLED=${TAG_FIX_ENABLED:-true}
      - MUSICBRAINZ_CONTACT=${MUSICBRAINZ_CONTACT:-}
      - TAG_FIX_TIMEOUT_SECONDS=${TAG_FIX_TIMEOUT_SECONDS:-60}
      # How long one probe of a playlist, album or artist page may take.
      - PROBE_TIMEOUT_SECONDS=${PROBE_TIMEOUT_SECONDS:-120}
      # Rate limits. YTDLP_SLEEP_REQUESTS paces yt-dlp's extractor requests
      # (yt-dlp's own `-t sleep` preset uses 0.75; 0 turns it off), and
      # RATE_LIMIT_ATTEMPTS is how many times a job waits out a 429 before it
      # gives up. See "Rate limits" in the README.
      - YTDLP_SLEEP_REQUESTS=${YTDLP_SLEEP_REQUESTS:-0.75}
      - RATE_LIMIT_ATTEMPTS=${RATE_LIMIT_ATTEMPTS:-5}
      # The PO-token sidecar below. A proof-of-origin token is what keeps an
      # anonymous, containerised yt-dlp out of YouTube's bot check; cookies are
      # the manual last resort, not the first answer. Empty leaves the plugin
      # at its own default, which is a provider on localhost -- i.e. none.
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-http://pot-provider:4416}
      # Cookies for YouTube's "Sign in to confirm you're not a bot" check.
      # Unset by default; see the README. Set it to the *container* path below,
      # /cookies/youtube.txt, and point YTDLP_COOKIES_HOST_PATH at the file on
      # the host. The backend only ever reads the file -- it loads it into an
      # in-memory cookie jar at startup and never writes one back -- so the
      # mount below is read-only.
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
    volumes:
      - ${DOWNLOAD_PATH:-/data/music/downloads}:${DOWNLOAD_PATH:-/data/music/downloads}
      - music-for-arr-data:/config
      # compose has no conditional mounts, so the default source is /dev/null:
      # the stack still starts when no cookies file is configured, and nothing
      # reads /cookies/youtube.txt unless YTDLP_COOKIES_FILE names it.
      - ${YTDLP_COOKIES_HOST_PATH:-/dev/null}:/cookies/youtube.txt:ro
    depends_on:
      # Long form so `required: false` applies (Compose >= 2.20): an unhealthy
      # or missing sidecar degrades YouTube downloads, it does not stop the
      # backend from starting, and the backend logs which PO-token providers
      # it loaded either way.
      pot-provider:
        condition: service_healthy
        required: false

  # The PO-token provider. YouTube expects a proof-of-origin token with every
  # player request; without one an anonymous client loses formats and is asked
  # to "sign in to confirm you're not a bot" within a few dozen downloads. The
  # token is minted by a JavaScript runtime this sidecar runs, and the backend
  # reaches it through the `bgutil-ytdlp-pot-provider` yt-dlp plugin in
  # requirements.txt.
  #
  # No `ports`: it is only ever spoken to from the backend over the compose
  # network, and its API takes an arbitrary URL to mint against, so publishing
  # it on the host would be handing that out.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    container_name: music-for-arr-pot-provider
    restart: unless-stopped
    init: true
    # The image carries neither curl nor wget, so the check is node's own
    # fetch against the provider's /ping endpoint.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # Polled every 3 s for the first 30 s (Engine 25+), so a healthy sidecar
      # is marked healthy in a few seconds instead of thirty, and a dead one
      # still gives up after about half a minute.
      start_period: 30s
      start_interval: 3s

volumes:
  music-for-arr-data: {}
