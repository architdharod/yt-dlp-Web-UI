server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression is server-wide, not per-location: the two responses that
    # actually benefit are the JS bundle (~420 KB, ~135 KB gzipped) served out
    # of /assets/ and the /library JSON, and a gzip block nested in one
    # location silently leaves the other uncompressed.
    #
    # text/event-stream is excluded solely by the gzip_types list below, which
    # is why that list must stay explicit -- adding text/plain or * would match
    # /queue/stream and buffer events until the gzip window filled, which is the
    # one latency an SSE stream cannot have.
    #
    # gzip_proxied any because this stack usually sits behind another reverse
    # proxy (which sets Via), and nginx refuses to gzip a proxied response by
    # default.  gzip_vary because /queue and /health set no Cache-Control, so a
    # shared cache upstream could otherwise store one gzipped body and replay it
    # to a client that never sent Accept-Encoding: gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://yt-dlp-web-ui-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support -- disable buffering so events stream in real-time
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # Long-lived streams and slow metadata probes on POST /download
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Never cache the app shell: it references hashed asset filenames that
    # change on every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
